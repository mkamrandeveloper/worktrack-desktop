<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Project Wizard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",
            theme: {

                        "secondary-fixed-dim": "#c3c0ff",

                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#191c1e",
                        "outline": "#6d7a77",

                        "background": "#faf8ff",

                        "outline-variant": "#bcc9c6",

                        "primary": "#00685f",
                        "secondary-fixed": "#e2dfff",

                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-dim": "#d2d9f4",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e2e7ff",
                        "on-error-container": "#93000a",
                        "on-background": "#131b2e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-sm": "12px",
                        "base": "8px",
                        "container-padding": "24px",
                        "stack-lg": "48px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"],

                    },
                    "fontSize": {

<style>body {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAAmce11jhEScFtEmKnOPRGDEk1XcZ-yeGeBfU6jEtwIvu8U0OSNqG_lJDWrTsUqoPIQ5js3KzqyIte6FBAyOvuc7HIN940PLZUJ9ReVc-4843RM4RsxY3-8-Tbyuk3lrH3TilhRUbr9voTxV9qPA9VuVlNzOblBp57khRIQGj6DPpGvskEr_SDHDTg4e--NrpxctaMxnVieO-W1y-Xhjmr1XrHtXQ2Fiw-MNIEKQMXEJul-bZPLfdSKg);
    background-size: cover;
    background-position: center
    }
.glass-modal {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 30px 60px rgba(15, 23, 42, 0.04)
    }
.glass-input {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid #e2e8f0;
    transition: all 0.3s ease
    }
.glass-input:focus {
    border-color: #4b41e1;
    box-shadow: 0 0 0 4px rgba(75, 65, 225, 0.1);
    outline: none
    }</style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-background relative" data-alt="A blurred background showing a modern web dashboard interface in light mode. Soft light gray and white tones dominate, with subtle hints of teal and indigo indicating charts and data elements out of focus. The overall mood is professional, bright, and airy.">
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-gutter bg-slate-900/10 backdrop-blur-sm">
<!-- Modal Content -->
<div class="glass-modal w-full max-w-2xl rounded-2xl p-container-padding flex flex-col gap-stack-lg relative">
<!-- Close Button -->
<button aria-label="Close modal" class="absolute top-container-padding right-container-padding text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<!-- Header Section -->
<div class="flex flex-col gap-stack-sm">
<!-- Step Indicator -->
<div class="flex items-center gap-base">
<span class="font-label-caps text-label-caps text-primary uppercase">Step 1 of 6</span>
<div class="flex-1 h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-1/6"></div>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Create New Project</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Let's start with the basics. Give your project a clear name and purpose.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md flex-1">
<!-- Project Name Input -->
<div class="flex flex-col gap-base">
<label class="font-body-sm text-body-sm text-on-surface font-medium" for="projectName">Project Name</label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" id="projectName" placeholder="e.g. Q3 Marketing Campaign" type="text"/>
</div>
<!-- Description Input -->
<div class="flex flex-col gap-base">
<label class="font-body-sm text-body-sm text-on-surface font-medium" for="projectDescription">Description</label>
<textarea class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 resize-none" id="projectDescription" placeholder="Briefly describe the goals and scope of this project..." rows="4"></textarea>
<p class="font-body-sm text-body-sm text-on-surface-variant text-right">0/250</p>
</div>
</form>
<!-- Actions Section -->
<div class="flex items-center justify-between mt-auto pt-stack-md border-t border-outline-variant/30">
<button class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors px-4 py-2" type="button">
                    Cancel
                </button>
<button class="bg-[#0D9488] hover:bg-[#0f766e] text-white font-body-md text-body-md px-6 py-3 rounded-lg shadow-sm transition-all duration-300 flex items-center gap-2" type="button">
                    Next Step
                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
