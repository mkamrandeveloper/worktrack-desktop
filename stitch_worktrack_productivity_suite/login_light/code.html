<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WorkTrack - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#727577",
                        "tertiary-fixed": "#e0e3e5",
                        "on-tertiary-container": "#fbfdff",
                        "secondary": "#4b41e1",
                        "on-secondary-fixed": "#0f0069",
                        "surface-bright": "#faf8ff",
                        "surface-variant": "#dae2fd",
                        "on-tertiary-fixed-variant": "#444749",
                        "error-container": "#ffdad6",
                        "primary-container": "#008378",
                        "secondary-fixed-dim": "#c3c0ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#005049",
                        "inverse-primary": "#6bd8cb",
                        "outline": "#6d7a77",
                        "on-tertiary-fixed": "#191c1e",
                        "secondary-container": "#645efb",
                        "surface-container": "#eaedff",
                        "on-secondary-fixed-variant": "#3323cc",
                        "tertiary": "#595c5e",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eef0ff",
                        "on-primary": "#ffffff",
                        "surface": "#faf8ff",
                        "on-secondary-container": "#fffbff",
                        "on-surface": "#131b2e",
                        "surface-container-low": "#f2f3ff",
                        "surface-tint": "#006a61",
                        "on-primary-fixed": "#00201d",
                        "surface-container-highest": "#dae2fd",
                        "primary-fixed": "#89f5e7",
                        "error": "#ba1a1a",
                        "background": "#faf8ff",
                        "inverse-surface": "#283044",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#bcc9c6",
                        "primary-fixed-dim": "#6bd8cb",
                        "on-surface-variant": "#3d4947",
                        "on-primary-container": "#f4fffc",
                        "secondary-fixed": "#e2dfff",
                        "primary": "#00685f",
                        "surface-dim": "#d2d9f4",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-container-high": "#e2e7ff",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-background": "#131b2e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "stack-lg": "48px",
                        "base": "8px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "stack-sm": "12px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .mesh-bg {
            background-color: #faf8ff;
            background-image: radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 0) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0) 0, transparent 50%);
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            position: relative;
        }
        
        .mesh-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(75, 65, 225, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(0, 104, 95, 0.08) 0%, transparent 30%);
            z-index: 0;
            pointer-events: none;
            animation: pulse-bg 15s infinite alternate ease-in-out;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, 2%); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px -12px rgba(19, 27, 46, 0.04);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: #4b41e1;
            box-shadow: 0 0 0 4px rgba(75, 65, 225, 0.1);
            outline: none;
            background: rgba(255, 255, 255, 0.8);
        }

        .teal-btn {
            background: linear-gradient(180deg, #0D9488 0%, #00685f 100%);
            transition: all 0.3s ease;
        }
        
        .teal-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -5px rgba(0, 104, 95, 0.3);
            background: linear-gradient(180deg, #0Faba0 0%, #007a6f 100%);
        }
        
        .teal-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px -5px rgba(0, 104, 95, 0.3);
        }
    </style>
</head>
<body class="mesh-bg min-h-screen flex items-center justify-center p-gutter md:p-stack-md font-body-md text-on-surface antialiased overflow-hidden">
<!-- Animated background elements to enhance depth -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-secondary/5 rounded-full blur-[80px] -z-10 mix-blend-multiply"></div>
<div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-primary/5 rounded-full blur-[100px] -z-10 mix-blend-multiply"></div>
<div class="w-full max-w-md relative z-10">
<!-- Logo Header -->
<div class="text-center mb-stack-md">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-sm mb-base border border-white/60 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-secondary/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<span class="material-symbols-outlined text-4xl text-primary relative z-10" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    dashboard
                </span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight mt-base">WorkTrack</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Premium Productivity</p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-[24px] p-stack-md md:p-stack-lg relative overflow-hidden">
<!-- Subtle edge highlight -->
<div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white to-transparent opacity-80"></div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-md">Sign In</h2>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-tertiary-container text-xl">
                                mail
                            </span>
</div>
<input class="glass-input block w-full pl-11 pr-4 py-3 rounded-xl font-body-md text-body-md text-on-surface placeholder-tertiary-container" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-secondary transition-colors font-medium" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-tertiary-container text-xl">
                                lock
                            </span>
</div>
<input class="glass-input block w-full pl-11 pr-11 py-3 rounded-xl font-body-md text-body-md text-on-surface placeholder-tertiary-container" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center">
<button class="text-tertiary-container hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-xl">
                                    visibility_off
                                </span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="teal-btn w-full flex justify-center items-center py-4 px-4 rounded-xl text-white font-body-md text-body-md font-semibold tracking-wide" type="submit">
                    Sign In
                    <span class="material-symbols-outlined ml-2 text-xl" style="font-variation-settings: 'wght' 600;">
                        arrow_forward
                    </span>
</button>
</form>
<div class="mt-stack-md pt-stack-md border-t border-slate-200/50 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-secondary font-medium hover:underline underline-offset-4" href="#">Contact Administrator</a>
</p>
</div>
</div>
</div>
<script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('.glass-input');
        
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                const icon = this.parentElement.querySelector('.material-symbols-outlined:not(button .material-symbols-outlined)');
                if(icon) {
                    icon.classList.remove('text-tertiary-container');
                    icon.classList.add('text-secondary');
                }
            });
            
            input.addEventListener('blur', function() {
                const icon = this.parentElement.querySelector('.material-symbols-outlined:not(button .material-symbols-outlined)');
                if(icon) {
                    icon.classList.remove('text-secondary');
                    icon.classList.add('text-tertiary-container');
                }
            });
        });

        // Simple password toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        
        if(toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                const icon = toggleBtn.querySelector('.material-symbols-outlined');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    icon.textContent = 'visibility';
                    icon.classList.add('text-primary');
                } else {
                    passInput.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.classList.remove('text-primary');
                }
            });
        }
    </script>
</body></html>
